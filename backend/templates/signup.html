<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AssetFlow ERP | Sign Up</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet"
    href="{{ url_for('static', filename='css/signup.css') }}">
  

</head>

<body>

    
        


<div class="signup-card">
    <div class="signup-header">
     <div class="signup-logo">
            <svg                                      
                    xmlns="http://www.w3.org/2000/svg"
                   width="110"
                    height="110"
                    viewBox="0 0 220 220"> 
                <g id="lines">
                <line id = "first"
                    x1= "110"
                    y1 = "30"
                    x2= "80"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" /> <!--a line whose start point is x1 y1 and endpouint is y1 y2-->
                    <line id = "second"
                    x1= "80"
                    y1 = "70"
                    x2= "60"
                    y2= "110"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id ="third"
                    x1= "110"
                    y1 = "30"
                    x2= "140"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id = "fourth"
                    x1= "140"
                    y1 = "70"
                    x2= "160"
                    y2= "110"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id = "crossbar"
                    x1= "140"
                    y1 = "70"
                    x2= "80"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                </g>
                <g id="nodes">
                <circle id = "top"
                cx="110"   
                cy="30"
                r="6"
                fill="#2E6F40"/>
                <!--cx-centre xcordinate cy- centre ycoordinate which means our circle ka centre has coordinates 110,30 adn r is the radoius of circle -->
                <circle id = "left-middle"
                cx="80"   
                cy="70"
                r="6"
                fill="#2E6F40"/>
                <circle id = "right-middle"
                cx="140"   
                cy="70"
                r="6"
                fill="#2E6F40"/>
                <circle id = "bottom-left"
                cx="60"   
                cy="110"
                r="6"
                fill="#2E6F40"/>
                <circle id= "bottom-right"
                cx="160"   
                cy="110"
                r="6"
                fill="#2E6F40"/>
                </g>
            </svg>
        </div>

        <h3 class ="signup-title">Create your account</h3>
        <p class = "signup-subtitle">Join AssetFlow and start managing your organization's assets with confidence.</p>

    </div>


    <form action="/signup" method="POST">


        <div class="signup-form">

            <label class="label">Email Address</label>

            <input
                type="email"
                name="email"
                id="email"
                placeholder="Enter Email"
                required>


        

            <label class="form-label">Password</label>
            <div class="password-container">
                <input
                    type="password"
                    name="password"
                    id = "password"
                    placeholder="Enter Password"
                    required>
                <i class="fa-solid fa-eye eye-icon" onclick="togglePassword()"></i>
            </div>
        </div>

        <button type="submit" class="button">

            <i class="fa-solid fa-user-plus"></i>

            Create Account

        </button>

    </form>
    <div class="foot">

        <div class="login-text">

            Already have an account?

            <a href="/login" class="sign">Sign In →</a>

        </div>
    </div>
</div>
<script src="{{ url_for('static', filename='js/signup.js') }}"></script>

</body>

</html>
