<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1">

<title>AssetFlow LOGIN</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">
</head>

<body>







<div class="login-card">
        {% with messages = get_flashed_messages(with_categories=true) %}

    {% if messages %}

        {% for category, message in messages %}

            <div class="flash-message {{category}}">
                {{message}}
            </div>

        {% endfor %}

    {% endif %}

    {% endwith %}
    <div class="login-header">
        <div class="login-logo">
            <svg                                      
                    xmlns="http://www.w3.org/2000/svg"
                   width="170"
                    height="170"
                    viewBox="0 0 220 220"> 
                <g id="lines">
                <line id = "first"
                    x1= "110"
                    y1 = "30"
                    x2= "80"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" /> <!--a line whose start point is x1 y1 and endpouint is y1 y2-->
                    <line id = "second"
                    x1= "80"
                    y1 = "70"
                    x2= "60"
                    y2= "110"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id ="third"
                    x1= "110"
                    y1 = "30"
                    x2= "140"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id = "fourth"
                    x1= "140"
                    y1 = "70"
                    x2= "160"
                    y2= "110"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                    <line id = "crossbar"
                    x1= "140"
                    y1 = "70"
                    x2= "80"
                    y2= "70"
                    stroke = "#2E6F40"
                    stroke-width = "3"
                    stroke-linecap = "round" />
                </g>
                <g id="nodes">
                <circle id = "top"
                cx="110"   
                cy="30"
                r="6"
                fill="#2E6F40"/>
                <!--cx-centre xcordinate cy- centre ycoordinate which means our circle ka centre has coordinates 110,30 adn r is the radoius of circle -->
                <circle id = "left-middle"
                cx="80"   
                cy="70"
                r="6"
                fill="#2E6F40"/>
                <circle id = "right-middle"
                cx="140"   
                cy="70"
                r="6"
                fill="#2E6F40"/>
                <circle id = "bottom-left"
                cx="60"   
                cy="110"
                r="6"
                fill="#2E6F40"/>
                <circle id= "bottom-right"
                cx="160"   
                cy="110"
                r="6"
                fill="#2E6F40"/>
                </g>
            </svg>
        </div>
   
    <h1 class="login-title">Welcome Back</h1>
    <p class = "login-subtitle">Sign in to continue .....</p>
    </div>
    <div class="form-login">
        <form action="/login" method="POST" id="loginForm">
           <label>Email</label>
            <input type="email" placeholder="Enter your email" name="email">
            <label>Password</label>
            <div class="password-container">
                <input type="password" id="password" placeholder="Enter your password" name="password">
                <i class="fa-solid fa-eye eye-icon" onclick="togglePassword()"></i>
            </div>
            <div class="foot">
            <a href="" class="forgot">Forgot Password?</a>
            
            <a href="/signup" class="sign">Sign Up</a>
            </div>
            <button class="button" type="submit">Login</button>
        </form>
        
    </div>
    
</div>






<script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>

</html>
